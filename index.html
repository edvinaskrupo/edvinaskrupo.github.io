<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>4-Line Latin-to-Lithuanian Translator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 2em;
      background: #f7f7f7;
    }

    h1 {
      text-align: center;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      background: #fff;
      padding: 1em;
      border-radius: 5px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 0.5em;
      margin-bottom: 1em;
      resize: vertical;
    }

    button {
      display: inline-block;
      margin-right: 1em;
      padding: 0.5em 1em;
      cursor: pointer;
      border: none;
      border-radius: 3px;
      background-color: #007BFF;
      color: #fff;
      font-size: 1em;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #0056b3;
    }

    #outputDiv {
      margin-top: 1em;
      white-space: pre-wrap; /* preserve line breaks */
      background: #f0f0f0;
      padding: 1em;
      border-radius: 5px;
      min-height: 4em; /* just to show space even if empty */
    }

    .info {
      font-size: 0.9em;
      color: #888;
      margin-top: 1em;
    }
  </style>
</head>
<body>

  <h1>4-Line Latin-to-Lithuanian Translator</h1>
  <div class="container">
    <label for="inputTextArea">Enter your multi-line Latin text:</label>
    <textarea id="inputTextArea" rows="8" placeholder="Type or paste multiple lines of Latin text here..."></textarea>

    <div>
      <button onclick="generateLines()">Generate 4 lines</button>
      <button onclick="translateToLithuanian()">Translate to Lithuanian</button>
    </div>

    <div id="outputDiv"></div>
  </div>

  <script>
    // Replace with your actual Google Cloud API key
    const GOOGLE_TRANSLATE_API_KEY = "YOUR_API_KEY_HERE";

    // We'll store the randomly generated snippet here
    let generatedTextSnippet = "";

    /**
     * Splits user input into lines, filters out empty lines,
     * chooses a random consecutive group of 4 lines,
     * and displays them.
     */
    function generateLines() {
      const textInput = document.getElementById("inputTextArea").value;
      const lines = textInput.split(/\r?\n/).filter(Boolean); // remove empty lines

      if (lines.length < 4) {
        document.getElementById("outputDiv").textContent = 
          "Please enter at least 4 lines of text to generate a snippet.";
        return;
      }

      // Pick a random starting index where we can get 4 consecutive lines
      const randomStart = Math.floor(Math.random() * (lines.length - 3));
      const selectedLines = lines.slice(randomStart, randomStart + 4);

      // Store the 4 lines in a global variable
      generatedTextSnippet = selectedLines.join("\n");

      // Display them
      document.getElementById("outputDiv").textContent = generatedTextSnippet;
    }

    /**
     * Calls the Google Translation API to translate the snippet
     * from Latin (la) to Lithuanian (lt).
     */
    async function translateToLithuanian() {
      if (!generatedTextSnippet) {
        document.getElementById("outputDiv").textContent =
          "No lines to translate. Please click 'Generate 4 lines' first.";
        return;
      }

      try {
        const translatedText = await googleTranslate(generatedTextSnippet, 'la', 'lt');
        document.getElementById("outputDiv").textContent = translatedText;
      } catch (error) {
        document.getElementById("outputDiv").textContent =
          "Translation failed: " + error.message;
      }
    }

    /**
     * Sends a request to the Google Translation API
     * to translate `text` from `sourceLang` to `targetLang`.
     *
     * @param {string} text - The text to translate
     * @param {string} sourceLang - The source language code (e.g., 'la' for Latin)
     * @param {string} targetLang - The target language code (e.g., 'lt' for Lithuanian)
     * @returns {Promise<string>} - The translated text
     */
    async function googleTranslate(text, sourceLang, targetLang) {
      const url = `https://translation.googleapis.com/language/translate/v2?key=${AIzaSyAM2gJwnJxNHyYvVfInw47x8iNLD11eNkg}`;

      // The body for POST
      const body = {
        q: text,
        source: sourceLang,
        target: targetLang,
        format: 'text'
      };

      // Send a POST request
      const response = await fetch(url, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(body)
      });

      // Parse the response
      const data = await response.json();

      if (data && data.data && data.data.translations && data.data.translations[0]) {
        return data.data.translations[0].translatedText;
      } else {
        throw new Error("No translation found in response.");
      }
    }
  </script>
</body>
</html>
